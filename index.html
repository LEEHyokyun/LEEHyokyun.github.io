<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scccurri.github.io/portfolio/index.html" />
    <meta property="og:title" content="김르탄 이력서" />
    <meta property="og:image" content="image/OGimage.png" />
    <meta property="og:description" content="김르탄 이력서입니다." />
    <meta property="og:site_name" content="SCC Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <title>김르탄 이력서</title>
    <style>
        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap");

        :root {
            --primary-color: #0066ff; /* 트레이드잇브릿지 스타일의 신뢰감을 주는 블루 */
            --dark-color: #1a1a1a;
            --gray-color: #666666;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
            --font-family: "Noto Sans KR", sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--dark-color);
            background-color: #ffffff;
            line-height: 1.6;
        }

        /* 1. 상단 고정 헤더 (GNB) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .header-logo {
            height: 35px;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--dark-color);
            font-weight: 500;
            margin-left: 30px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .header-nav a:hover {
            color: var(--primary-color);
        }

        /* 메인 컨테이너 구조 변경 (원형 사이드바 제거, 와이드 레이아웃) */
        main {
            margin-top: 70px;
            width: 100%;
        }

        section {
            padding: 100px 10%;
            border-bottom: 1px solid var(--border-color);
        }

        section:nth-child(even) {
            background-color: var(--light-bg);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 50px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 40px;
            height: 4px;
            background-color: var(--primary-color);
        }

        /* 2. INTRO (히어로 섹션) */
        #intro {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: calc(85vh - 70px);
            gap: 5%;
        }

        .intro-content {
            flex: 1;
        }

        .intro-tag {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
        }

        .intro-text {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 25px;
        }

        .intro-text-detail {
            font-size: 1.1rem;
            color: var(--gray-color);
            line-height: 1.8;
        }

        .intro-image-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-profile-img {
            width: 100%;
            max-width: 450px;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        /* 3. ABOUT ME (기존 사이드바 정보를 깔끔한 그리드로) */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .about-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .about-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .about-info-title {
            font-size: 0.85rem;
            color: var(--gray-color);
            margin-bottom: 5px;
        }

        .about-info-desc {
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-all;
        }

        /* 역량/자격증/학력 서브 그리드 */
        .sub-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 50px;
        }

        .sub-info-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--dark-color);
        }

        .strength-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .strength-tag {
            background-color: #e6f0ff;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 스킬바 재디자인 */
        .skill-item {
            margin-bottom: 20px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .skill-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .skill-bar-progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%; /* JS로 제어 */
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        .license-item, .edu-item {
            padding: 15px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .edu-item p {
            color: var(--gray-color);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* 4. EXPERIENCE (회사소개 페이지 핵심: 가로 타임라인 연출) */
        .exp-timeline {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
        }

        .exp-timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: var(--border-color);
        }

        .exp-row {
            display: flex;
            position: relative;
            padding-left: 60px;
        }

        .exp-row::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 4px solid var(--primary-color);
            z-index: 2;
        }

        .exp-time {
            width: 200px;
            flex-shrink: 0;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .exp-body {
            flex-grow: 1;
        }

        .exp-company {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .exp-team {
            font-size: 1rem;
            color: var(--gray-color);
            font-weight: 500;
            margin-bottom: 15px;
        }

        .exp-details {
            background-color: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .exp-project-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        .exp-desc {
            font-size: 0.95rem;
            color: var(--gray-color);
        }

        /* 5. PROJECT (트레이드잇브릿지 스타일 카드 그리드) */
        .proj-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 40px;
        }

        .proj {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .proj:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .proj-main-img {
            width: 100%;
