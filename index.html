<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/LEEHyokyun/LEEHyokyun.github.io/edit/main/index.html" />
    <meta property="og:title" content="LEE HYO KYUN" />
    <meta property="og:image" content="image/OGimage.png" />
    <meta property="og:description" content="LEE HYO KYUN" />
    <meta property="og:site_name" content="SCC Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <title>LEEHYOKYUN</title>
    <style>
        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap");

        :root {
            --primary-color: #2563eb; 
            --dark-color: #111827;
            --gray-color: #4b5563;
            --light-bg: #f9fafb;
            --border-color: #e5e7eb;
            --font-family: "Noto Sans KR", sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--dark-color);
            background-color: #ffffff;
            line-height: 1.6;
        }

        /* 1. 상단 고정 헤더 (GNB) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .header-logo {
            height: 45px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .header-logo:hover {
            transform: scale(1.02);
        }

        .header-nav {
            display: flex;
            gap: 28px;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--dark-color);
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all 0.2s ease;
            padding: 4px 0;
        }

        .header-nav a:hover {
            color: var(--primary-color);
        }

        /*우측 상단 섹션탭에 대한 애니메이션 적용*/
        .header-nav a.active {
            color: var(--primary-color);
            position: relative;
        }
        
        .header-nav a.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
            animation: navWave 0.3s ease;
        }

        /*클릭했을때 애니메이션 추가 적용*/
        .header-nav a.clicked{
            color: #8B5A2B;
        }
        
        @keyframes navWave {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        
        main {
            margin-top: 75px;
        }

        section {
            padding: 100px 10%;
            border-bottom: 1px solid var(--border-color);
        }

        section:nth-child(even) {
            background-color: var(--light-bg);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 50px;
            position: relative;
            display: inline-block;
            letter-spacing: -0.02em;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 40px;
            height: 4px;
            background-color: var(--primary-color);
        }

        /* 현재 보고 있는 section 제목 강조 */
        .section-title.active {
            color: var(--primary-color);
            transition: color 0.3s ease;
        }
        
        .section-title.active::after {
            width: 100%;
            transition: width 0.3s ease;
        }

        /* 2. INTRO (히어로 섹션) */
        #intro {
            min-height: calc(85vh - 75px);
        }

        .intro-notice {
            display: inline-block;
        
            color: #7c3aed;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        
            text-shadow:
                0 1px 0 #ffffff,
                0 2px 3px rgba(124, 58, 237, 0.25),
                0 4px 8px rgba(124, 58, 237, 0.15);
        
            transform: translateZ(0);
        }
        
        .intro-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5%;
        }
        
        .intro-content {
            flex: 1;
        }

        .intro-tag {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 15px;
            display: block;
        }

        .intro-text {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 25px;
            word-break: keep-all;
        }

        .intro-text-detail {
            font-size: 1.1rem;
            color: var(--gray-color);
            line-height: 1.8;
            word-break: keep-all;
        }

        .intro-image-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-highlight {
            margin-top: 40px;
        
            display: inline-flex;
            flex-direction: column;
            gap: 8px;
        
            padding: 16px 22px;
        
            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-left: 4px solid var(--primary-color);
            border-radius: 10px;
        
            width: fit-content;
            max-width: 420px;
        }

        .intro-highlight strong {
            color: #7c3aed;            /* 보라색 */
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
        
            text-shadow:
                0 1px 0 #ffffff,
                0 2px 4px rgba(124, 58, 237, 0.25);
        }

        .intro-highlight span {
            color: var(--dark-color);
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.8;
            word-break: keep-all;
        }
                
        .intro-profile-img {
            width: 100%;
            max-width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        /* 3. BOARDS (수치화 대시보드) */
        #boards {
            background-color: #ffffff;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
        }

        .stats-card {
            background-color: transparent;
            border: none;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        .stat-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray-color);
            margin-bottom: 12px;
        }

        .stats-num-wrapper {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .stats-num {
            font-size: 5.5rem;
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .stat-unit {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-left: 2px;
        }

        .stats-desc {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #374151;
            word-break: keep-all;
        }

        /* 4. ABOUT (Develop Universe) */
        .link-universe-container {
            width: 100%;
            margin-bottom: 50px;
            padding-bottom: 50px;
            border-bottom: 1px solid var(--border-color);
        }

        .universe-header {
            width: 100%;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--dark-color);
            padding-bottom: 12px;
        }

        .universe-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-divider {
            color: var(--border-color);
            font-weight: 300;
        }

        .en-title {
            font-size: 1.3rem;
            color: var(--gray-color);
            font-weight: 500;
        }

        /* 링크 카드 정렬 방식 수정 */
        .about-links-line {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            width: 100%;
        }

        .icon-link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background-color: var(--light-bg);
            padding: 24px 16px;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid #f3f4f6;
            transition: all 0.2s ease-in-out;
        }

        .icon-link-item:hover {
            background-color: #ffffff;
            border-color: var(--primary-color);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        /* 아이콘별 고유 배경색 정의 적용 */
        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: #ffffff;
        }
        .bg-linkedin { background-color: #0a66c2; }
        .bg-github   { background-color: #24292e; }
        .bg-velog    { background-color: #20c997; }
        .bg-storyboard { background-color: #f59e0b; }
        .bg-engineering { background-color: #6b7280; }

        .icon-wrapper svg {
            width: 24px;
            height: 24px;
        }

        .icon-link-label {
            font-size: 1rem;
            font-weight: 700;
            color: #1f2937;
            transition: color 0.2s ease;
        }

        .icon-link-item:hover .icon-link-label {
            color: var(--primary-color);
        }

        /* 5. Contributions & Skills 구역 구조 */
        .sub-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
        }

        .sub-info-box {
            width: 100%;
        }

        .sub-info-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--dark-color);
        }

        .strength-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .strength-tag {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary-color);
            background-color: #eff6ff;
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skill-item {
            margin-bottom: 5px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .skill-level {
            font-size: 0.9rem;
            font-weight: 800;
        }

        .level-high { color: #ef4444 !important; }
        .level-mid  { color: #2563eb !important; }
        .level-low  { color: #10b981 !important; }

        .skill-step-bar {
            display: flex;
            gap: 2px;
            width: 100%;
            height: 10px;
        }

        .skill-step-bar .step {
            flex: 1 1 0;
            min-width: 0;
            background-color: #e5e7eb;
            border-radius: 2px;
        }
        .skill-step-bar.level-high .step.active { background-color: #ef4444; }
        .skill-step-bar.level-mid .step.active { background-color: #2563eb; }
        .skill-step-bar.level-low .step.active { background-color: #10b981; }

        /* Details 섹션 스타일 */
        .edu-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .edu-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .edu-label {
            font-size: 0.88rem;
            color: var(--gray-color);
            font-weight: 500;
        }

        .edu-val {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark-color);
        }

        .edu-val-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .edu-val-group .edu-val {
            font-size: 0.95rem;
        }

        /* 6. EXPERIENCES 섹션 스타일 */
        .exp-domains-summary {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .domain-summary-tag {
            font-size: 0.85rem;
            font-weight: 600;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #bfdbfe;
            white-space: nowrap;
        }

        .exp-timeline {
            display: flex;
            flex-direction: column;
            gap: 50px;
            position: relative;
        }

        /* 타임라인 중앙 라인 */
        .exp-timeline::before {
            content: '';
            position: absolute;
            left: 44px;
            top: 30px;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--primary-color), #e5e7eb);
        }

        .exp-row {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            position: relative;
            padding-left: 0;
        }

        /* 타임라인 날짜 박스 */
        .exp-time {
            position: relative;
            min-width: 140px;
        }

        .exp-time-box {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
        }

        .exp-time::before {
            content: '';
            position: absolute;
            left: -58px;
            top: 8px;
            width: 16px;
            height: 16px;
            background-color: var(--primary-color);
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--border-color);
            z-index: 10;
        }

        .exp-time::after {
            content: '';
            position: absolute;
            left: -60px;
            top: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.1);
            z-index: 5;
        }

        .exp-body {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .exp-body:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
            transform: translateY(-2px);
        }

        .exp-company {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 12px;
        }

        .exp-team {
            font-size: 0.95rem;
            color: var(--gray-color);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .exp-domains {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }

        .domain-tag {
            font-size: 0.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #bfdbfe;
            white-space: nowrap;
        }

        .exp-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .exp-project-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .exp-desc {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.6;
            word-break: keep-all;
            margin: 0;
        }

        /* 7. PROJECTS 섹션 스타일 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px;
            margin-top: 30px;
        }

        .project-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.3s ease;
            cursor: pointer;

            /* project links */
            text-decoration: none;
            color: inherit;
        }

        .project-none {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.3s ease;
            cursor: pointer;

            /* project links */
            text-decoration: none;
            color: inherit;
        }

        .project-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
            transform: translateY(-4px);
        }

        /* .project-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark-color);
        }

        .project-period {
            font-size: 0.88rem;
            color: var(--gray-color);
            font-weight: 500;
        } */

            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.6;
            word-break: keep-all;
        } */

        /* 소속 및 배지 정렬 */
        .project-meta-zone {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        
        /* 호기심 유발 배지 (기존 그리드 톤에 맞춰 다크하거나 강렬하게 포인트) */
        .project-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background-color: #1e40af; 
            color: #ffffff;
            letter-spacing: 0.3px;
        }
        
        .project-title {
            font-size: 1.3rem; /* 가독성을 위해 살짝 확대 */
            font-weight: 800;  /* 700에서 조금 더 선명하게 변경 */
            color: var(--dark-color);
            margin: 0 0 1.2rem 0;
            line-height: 1.4;
        }
        
        .project-period {
            font-size: 0.85rem;
            color: var(--gray-color);
            font-weight: 500;
            margin: 0;
        }
        
        /* 2) 내용이 눈에 띄도록 강조한 디스크립션 영역 */
        .project-desc {
            margin-top: auto; /* 제목 길이와 상관없이 항상 하단 배치 */
            padding: 0.8rem 1rem;
            background-color: #f8fafc; /* 연한 그레이 박스로 영역 분리 */
            border-left: 4px solid var(--main-font-color); /* 왼쪽 라인 두께 강화 */
            border-radius: 0 6px 6px 0;
            transition: border-left-color 0.3s ease, background-color 0.3s ease;
        }
        
        /* 카드가 호버되면 텍스트 박스도 링크처럼 반응 */
        .project-card:hover .project-desc {
            border-left-color: #e74c3c; /* 배지 색상과 링크 통일감 */
            background-color: #fff5f5;  
        }
        
        .project-desc p {
            margin: 0;
            color: var(--text-color-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
            font-weight: 600; /* 글자를 더 눈에 띄게 굵기 업그레이드 */
            word-break: keep-all;
        }
        
        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tech-tag {
            font-size: 0.8rem;
            background-color: #eff6ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ========================================
         Portfolio Loading Screen
       ======================================== */

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 99999;

            transition: opacity 0.5s ease;
        }


        .loading-container {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }


        /* Loading Spinner */

        .loading-spinner {
            width: 48px;
            height: 48px;

            border: 4px solid #e5e7eb;
            border-top: 4px solid #111827;

            border-radius: 50%;

            animation: loading-spin 1s linear infinite;

            margin-bottom: 24px;
        }


        @keyframes loading-spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }


        /* Loading Title */

        .loading-title {
            margin: 0;

            font-size: 20px;
            font-weight: 600;

            color: #111827;
        }


        /* Loading Status */

        .loading-status {
            margin-top: 10px;

            font-size: 14px;

            color: #6b7280;
        }


        /* Loading 완료 후 Fade Out */

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
